Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: ../organizations/ordererOrganizations/digitalonehealth.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"
    OrdererEndpoints:
      - orderer.digitalonehealth.com:7050

  - &Hospital
    Name: HospitalMSP
    ID: HospitalMSP
    MSPDir: ../organizations/peerOrganizations/hospital.digitalonehealth.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('HospitalMSP.admin', 'HospitalMSP.peer', 'HospitalMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('HospitalMSP.admin', 'HospitalMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('HospitalMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('HospitalMSP.peer')"

  - &Research
    Name: ResearchMSP
    ID: ResearchMSP
    MSPDir: ../organizations/peerOrganizations/research.digitalonehealth.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('ResearchMSP.admin', 'ResearchMSP.peer', 'ResearchMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('ResearchMSP.admin', 'ResearchMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('ResearchMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('ResearchMSP.peer')"

  - &Individual
    Name: IndividualMSP
    ID: IndividualMSP
    MSPDir: ../organizations/peerOrganizations/individual.digitalonehealth.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('IndividualMSP.admin', 'IndividualMSP.peer', 'IndividualMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('IndividualMSP.admin', 'IndividualMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('IndividualMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('IndividualMSP.peer')"

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_0: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer.digitalonehealth.com:7050
  EtcdRaft:
    Consenters:
      - Host: orderer.digitalonehealth.com
        Port: 7050
        ClientTLSCert: ../organizations/ordererOrganizations/digitalonehealth.com/orderers/orderer.digitalonehealth.com/tls/server.crt
        ServerTLSCert: ../organizations/ordererOrganizations/digitalonehealth.com/orderers/orderer.digitalonehealth.com/tls/server.crt
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  DigitalOneHealthOrdererGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *Hospital
        - *Research
        - *Individual
      Capabilities: *ApplicationCapabilities

  HealthRecordsChannel:
    Consortium: SampleConsortium
    <<: *ChannelDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *Hospital
        - *Research
        - *Individual
      Capabilities: *ApplicationCapabilities