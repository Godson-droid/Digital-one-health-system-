services:
  - type: web
    name: digital-one-health-system
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: PORT
        value: 8001
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: false
      - key: DEPLOYMENT_ENV
        value: production