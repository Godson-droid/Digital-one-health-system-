services:
  - type: web
    name: digital-one-health-system
    env: python
    plan: free
    buildCommand: |
      pip install --upgrade pip setuptools wheel &&
      pip install --no-cache-dir --timeout=1000 -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: PORT
        value: 8001
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: false
      - key: DEPLOYMENT_ENV
        value: production
      - key: PIP_TIMEOUT
        value: 1000
      - key: PIP_DEFAULT_TIMEOUT
        value: 1000
      - key: FABRIC_GATEWAY_URL
        value: https://digital-fabric-network.onrender.com